name: Auto Tech Media Daily Automated Deploy to GitHub Pages

on:
  schedule:
    # 毎日日本時間 午前9:00 (UTC 00:00) に完全自動発火
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でいつでも即時発火可能
  push:
    branches:
      - main

# GitHub Pages への自動デプロイ権限を設定
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate High-Quality Articles & Self-Audit
        run: |
          python generator.py
          python audit_self.py
          python sns_bot.py

      - name: Deploy to GitHub Pages (100% Free & Unlimited)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
