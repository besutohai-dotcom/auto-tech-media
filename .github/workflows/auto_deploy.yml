name: Auto Tech Media Daily Automated Deploy Engine

on:
  schedule:
    # 毎日日本時間 午前9:00 (UTC 00:00) に完全自動発火
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub画面から手動でいつでも即時発火可能

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate High-Quality Articles & Build Dist
        run: |
          python generator.py

      - name: Deploy Directly to Netlify Production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python deploy.py
